<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Renew Calendar Widget</title>
<style>
:root{
  --teal:#18c6cf;
  --purple:#8a3ffc;
  --bg:#171919;
  --card:#242727;
  --muted:#a7abad;
  --line:#3b3f3f;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);
  font-family:Arial,Helvetica,sans-serif;color:#fff}
.widget{width:100%;height:100%;padding:4.5% 6% 5%;background:var(--bg)}
.header{padding-bottom:4%;border-bottom:1px solid var(--line)}
.eyebrow{font-size:clamp(12px,2.0vw,28px);font-weight:800;letter-spacing:.12em;color:var(--teal)}
.date{font-size:clamp(28px,4.7vw,66px);font-weight:800;line-height:1;margin-top:1%}
.weekday{font-size:clamp(14px,1.8vw,26px);color:var(--muted);margin-top:1%}

.events{display:flex;flex-direction:column;gap:0}
.event{
  padding:5% 0;
  border-bottom:1px solid var(--line);
}
.event:last-child{border-bottom:0}
.event-name{font-size:clamp(22px,3.0vw,44px);font-weight:800;line-height:1.08}
.event-sub{font-size:clamp(16px,2.0vw,29px);line-height:1.15;margin-top:1.2%;color:#f1f1f1}
.meta{display:flex;flex-wrap:wrap;gap:2.5%;align-items:center;margin-top:3.2%}
.meta-row{display:flex;align-items:center;gap:.7em;font-size:clamp(15px,1.9vw,27px);font-weight:700}
.icon{width:1.15em;height:1.15em;display:inline-flex;align-items:center;justify-content:center;
  color:var(--purple);font-size:1.05em}
.location .icon{color:var(--teal)}
.location{font-weight:500}

.count-2 .event{padding:4.3% 0}
.count-2 .event-name{font-size:clamp(22px,3.0vw,44px)}
.count-3 .event{padding:3.1% 0}
.count-3 .event-name{font-size:clamp(19px,2.55vw,37px)}
.count-3 .event-sub{font-size:clamp(14px,1.65vw,24px)}
.count-3 .meta{margin-top:2.2%}
.count-4 .event{padding:2.2% 0}
.count-4 .event-name{font-size:clamp(18px,2.25vw,32px)}
.count-4 .event-sub{font-size:clamp(13px,1.45vw,21px)}
.count-4 .meta{margin-top:1.7%}
.count-5 .event{padding:1.7% 0}
.count-5 .event-name{font-size:clamp(17px,2vw,28px)}
.count-5 .event-sub{font-size:clamp(12px,1.3vw,19px)}
.count-5 .meta{margin-top:1.3%}
</style>
</head>
<body>
<div class="widget">
  <header class="header">
    <div class="eyebrow">TODAY</div>
    <div class="date">AUGUST 21</div>
    <div class="weekday">Friday</div>
  </header>

  <main class="events" id="events"></main>
</div>

<script>
/*
  Temporary sample data.
  Later, this array will be replaced with Planning Center data automatically.
  The display order is:
    EVENT NAME → optional subtitle → TIME → LOCATION
*/
const events = [
  {
    name: "Renew 45",
    subtitle: "Bonfire Night",
    start: "6:00 PM",
    end: "8:00 PM",
    location: "Fire Pit · Upper Field"
  },
  {
    name: "Middle School Youth Group",
    subtitle: "Weekly Gathering",
    start: "7:00 PM",
    end: "8:30 PM",
    location: "Youth Room"
  },
  {
    name: "Worship Team Practice",
    subtitle: "Rehearsal",
    start: "8:00 PM",
    end: "9:30 PM",
    location: "Worship Center"
  }
];

const container = document.getElementById("events");
const count = Math.min(events.length, 5);
container.className = "events count-" + count;

container.innerHTML = events.slice(0,5).map(e => `
  <article class="event">
    <div class="event-name">${e.name}</div>
    ${e.subtitle ? `<div class="event-sub">${e.subtitle}</div>` : ""}
    <div class="meta">
      <div class="meta-row">
        <span class="icon">◷</span>
        <span>${e.start}${e.end ? " - " + e.end : ""}</span>
      </div>
      ${e.location ? `
      <div class="meta-row location">
        <span class="icon">⌖</span>
        <span>${e.location}</span>
      </div>` : ""}
    </div>
  </article>
`).join("");
</script>
</body>
</html>
