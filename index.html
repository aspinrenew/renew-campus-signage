<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Renew Calendar Widget</title>
<style>
:root{
  --teal:#18c6cf;
  --bg:#171919;
  --card:#242727;
  --muted:#a7abad;
  --line:#3b3f3f;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);
  font-family:Arial,Helvetica,sans-serif;color:#fff}
.widget{
  width:100%;height:100%;padding:6% 7%;
  background:var(--bg);
}
.eyebrow{font-size:clamp(14px,2.2vw,30px);font-weight:800;letter-spacing:.12em;color:var(--teal);margin-bottom:1%}
.date{font-size:clamp(30px,5vw,70px);font-weight:800;line-height:1}
.weekday{font-size:clamp(15px,2vw,28px);color:var(--muted);margin-top:1%}
.event-card{
  margin-top:8%;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:24px;
  padding:7%;
}
.event-kicker{font-size:clamp(13px,1.8vw,25px);font-weight:800;letter-spacing:.11em;color:var(--teal)}
.time{font-size:clamp(34px,5vw,68px);font-weight:800;margin:2% 0 4%}
.event-name{font-size:clamp(25px,3.4vw,48px);font-weight:800;line-height:1.1}
.event-sub{font-size:clamp(21px,2.7vw,38px);margin-top:1%}
.location-label{font-size:clamp(11px,1.4vw,19px);font-weight:800;letter-spacing:.11em;color:var(--muted);margin-top:9%}
.location{font-size:clamp(17px,2.1vw,29px);margin-top:1%}
.divider{height:1px;background:var(--line);margin:8% 0 5%}
.note{font-size:clamp(15px,1.8vw,25px);color:#d9dddd}
</style>
</head>
<body>
<div class="widget">
  <div class="eyebrow">TODAY</div>
  <div class="date">AUGUST 21</div>
  <div class="weekday">Friday</div>
  <div class="event-card">
    <div class="event-kicker">TONIGHT</div>
    <div class="time">6:00 PM</div>
    <div class="event-name">Renew 45</div>
    <div class="event-sub">Bonfire Night</div>
    <div class="location-label">LOCATION</div>
    <div class="location">Fire Pit · Upper Field</div>
    <div class="divider"></div>
    <div class="note">See you there!</div>
  </div>
</div>
</body>
</html>
