<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Renew Calendar Widget</title>
<style>
:root{
  --teal:#18c6cf;
  --purple:#8a3ffc;
  --bg:#171919;
  --card:#242727;
  --muted:#a7abad;
  --line:#3b3f3f;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);
  font-family:Arial,Helvetica,sans-serif;color:#fff}
.widget{width:100%;height:100%;padding:4.5% 6% 5%;background:var(--bg)}
.header{padding-bottom:4%;border-bottom:1px solid var(--line)}
.eyebrow{font-size:clamp(12px,2.0vw,28px);font-weight:800;letter-spacing:.12em;color:var(--teal)}
.date{font-size:clamp(28px,4.7vw,66px);font-weight:800;line-height:1;margin-top:1%}
.weekday{font-size:clamp(14px,1.8vw,26px);color:var(--muted);margin-top:1%}

.events{display:flex;flex-direction:column;gap:0}
.event{
  padding:5% 0;
  border-bottom:1px solid var(--line);
}
.event:last-child{border-bottom:0}
.event-name{font-size:clamp(22px,3.0vw,44px);font-weight:800;line-height:1.08}
.event-sub{font-size:clamp(16px,2.0vw,29px);line-height:1.15;margin-top:1.2%;color:#f1f1f1}
.meta{display:flex;flex-wrap:wrap;gap:2.5%;align-items:center;margin-top:3.2%}
.meta-row{display:flex;align-items:center;gap:.7em;font-size:clamp(15px,1.9vw,27px);font-weight:700}
.icon{width:1.15em;height:1.15em;display:inline-flex;align-items:center;justify-content:center;
  color:var(--purple);font-size:1.05em}
.location .icon{color:var(--teal)}
.location{font-weight:500}

.count-2 .event{padding:4.3% 0}
.count-2 .event-name{font-size:clamp(22px,3.0vw,44px)}
.count-3 .event{padding:3.1% 0}
.count-3 .event-name{font-size:clamp(19px,2.55vw,37px)}
.count-3 .event-sub{font-size:clamp(14px,1.65vw,24px)}
.count-3 .meta{margin-top:2.2%}
.count-4 .event{padding:2.2% 0}
.count-4 .event-name{font-size:clamp(18px,2.25vw,32px)}
.count-4 .event-sub{font-size:clamp(13px,1.45vw,21px)}
.count-4 .meta{margin-top:1.7%}
.count-5 .event{padding:1.7% 0}
.count-5 .event-name{font-size:clamp(17px,2vw,28px)}
.count-5 .event-sub{font-size:clamp(12px,1.3vw,19px)}
.count-5 .meta{margin-top:1.3%}
</style>
</head>
<body>
<div class="widget">
  <header class="header">
    <div class="eyebrow">TODAY</div>
    <div class="date">AUGUST 21</div>
    <div class="weekday">Friday</div>
  </header>

  <main class="events" id="events"></main>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzhndEZKAElPYCR3ccvO5UuwhH-mJEiKlZER28O93ACe5sXw1gNVpM1ADPfySCLGWy9Tg/exec';

const container = document.getElementById('events');

function formatTime(isoString) {
  if (!isoString) return '';

  return new Intl.DateTimeFormat('en-US', {
    timeZone: 'America/New_York',
    hour: 'numeric',
    minute: '2-digit'
  }).format(new Date(isoString));
}

function formatEventTime(time) {
  if (!time || !time.starts_at || !time.ends_at) {
    return '';
  }

  return `${formatTime(time.starts_at)} – ${formatTime(time.ends_at)}`;
}

function renderEvents(events) {
  const now = Date.now();

  const activeEvents = (events || []).filter(event => {
    return (event.kiosk_times || []).some(time => {
      return time.ends_at &&
        new Date(time.ends_at).getTime() > now;
    });
  });

  const displayEvents = activeEvents.slice(0, 5);

  container.className =
    `events events-count-${Math.min(displayEvents.length, 5)}`;

  if (displayEvents.length === 0) {
    container.innerHTML = `
      <div style="
        padding: 40px;
        font-size: 24px;
        color: #aaa;
      ">
        No kiosk events right now.
      </div>
    `;
    return;
  }

  container.innerHTML = displayEvents.map(event => {
    const activeTimes = (event.kiosk_times || []).filter(time => {
      return time.ends_at &&
        new Date(time.ends_at).getTime() > now;
    });

    const timesHtml = activeTimes.map(time => `
      <div class="meta-row">
        <span class="icon">◷</span>
        <span>${formatEventTime(time)}</span>
      </div>
    `).join('');

    return `
      <article class="event">
        <div class="event-name">${event.name || ''}</div>

        <div class="meta">
          ${timesHtml}

          ${event.location ? `
            <div class="meta-row location">
              <span class="icon">⌖</span>
              <span>${event.location}</span>
            </div>
          ` : ''}
        </div>
      </article>
    `;
  }).join('');
}

async function loadEvents() {
  try {
    console.log('Loading calendar from:', API_URL);

    const response = await fetch(
      API_URL + '?t=' + Date.now(),
      {
        cache: 'no-store'
      }
    );

    console.log('API response status:', response.status);

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    const data = await response.json();

    console.log('API data:', data);

    if (data.error) {
      throw new Error(data.message || 'API returned an error');
    }

    renderEvents(data.events || []);

  } catch (error) {
    console.error('Calendar API error:', error);

    container.innerHTML = `
      <div style="
        padding: 40px;
        font-size: 22px;
        color: #ff7777;
      ">
        Calendar connection error.<br><br>
        ${error.message}
      </div>
    `;
  }
}

loadEvents();

setInterval(loadEvents, 60 * 1000);
</script>
